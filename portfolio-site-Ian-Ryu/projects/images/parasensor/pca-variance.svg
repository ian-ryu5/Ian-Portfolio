<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="t d">
  <title id="t">PCA Components Retained</title>
  <desc id="d">Bar chart showing 216, 178, and 254 PCA components retained for the healthy, stroke, and combined configurations.</desc>
  <rect width="900" height="350" fill="#FBFCF9"/>
