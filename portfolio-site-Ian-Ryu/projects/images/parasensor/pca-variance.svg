  <text x="36" y="72" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13.5" fill="#5B6058">Components needed to reach the 90% cumulative-variance threshold</text>

  <line x1="228.0" y1="108" x2="228.0" y2="270" stroke="#DBDDD4" stroke-width="1"/>
  <text x="228.0" y="288" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#5B6058" text-anchor="middle">0</text>
  <line x1="346.0" y1="108" x2="346.0" y2="270" stroke="#DBDDD4" stroke-width="1"/>
  <text x="346.0" y="288" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#5B6058" text-anchor="middle">70</text>
  <line x1="464.0" y1="108" x2="464.0" y2="270" stroke="#DBDDD4" stroke-width="1"/>
  <text x="464.0" y="288" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#5B6058" text-anchor="middle">140</text>
  <line x1="582.0" y1="108" x2="582.0" y2="270" stroke="#DBDDD4" stroke-width="1"/>
  <text x="582.0" y="288" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#5B6058" text-anchor="middle">210</text>
  <line x1="700.0" y1="108" x2="700.0" y2="270" stroke="#DBDDD4" stroke-width="1"/>
  <text x="700.0" y="288" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#5B6058" text-anchor="middle">280</text>
  <text x="210" y="142" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13.5" fill="#171B1A" text-anchor="end">Healthy</text>
  <rect x="228" y="122" width="364.1" height="30" rx="3" fill="#E2A33B"/>
  <text x="716" y="142" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15" font-weight="500" fill="#171B1A">216</text>
  <text x="755" y="142" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12.5" fill="#5B6058">components</text>
  <text x="210" y="198" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13.5" fill="#171B1A" text-anchor="end">Stroke</text>
  <rect x="228" y="178" width="300.1" height="30" rx="3" fill="#E2A33B"/>
  <text x="716" y="198" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15" font-weight="500" fill="#171B1A">178</text>
  <text x="755" y="198" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12.5" fill="#5B6058">components</text>
  <text x="210" y="254" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13.5" fill="#171B1A" text-anchor="end">Combined</text>
  <rect x="228" y="234" width="428.2" height="30" rx="3" fill="#E2A33B"/>
  <text x="716" y="254" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15" font-weight="500" fill="#171B1A">254</text>
  <text x="755" y="254" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12.5" fill="#5B6058">components</text>
  <line x1="228" y1="270" x2="700" y2="270" stroke="#5B6058" stroke-width="1"/>
  <text x="36" y="324" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" fill="#6B4507">The combined configuration needed the most components to reach the same threshold.</text>
