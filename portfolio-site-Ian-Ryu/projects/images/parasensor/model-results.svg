<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="t d">
  <title id="t">Model Output By Configuration</title>
  <desc id="d">Bar chart of Random Forest test accuracy: 99.0 percent healthy, 96.0 percent stroke, 96.4 percent combined.</desc>
  <rect width="900" height="350" fill="#FBFCF9"/>
  <text x="36" y="46" font-family="Space Grotesk, Arial, sans-serif" font-size="24" font-weight="600" fill="#171B1A">Model Output By Configuration</text>
  <text x="36" y="72" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13.5" fill="#5B6058">Random Forest held-out test accuracy, after PCA reduction</text>

  <line x1="228.0" y1="108" x2="228.0" y2="270" stroke="#DBDDD4" stroke-width="1"/>
  <text x="228.0" y="288" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#5B6058" text-anchor="middle">0%</text>
  <line x1="346.0" y1="108" x2="346.0" y2="270" stroke="#DBDDD4" stroke-width="1"/>
  <text x="346.0" y="288" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#5B6058" text-anchor="middle">25%</text>
  <line x1="464.0" y1="108" x2="464.0" y2="270" stroke="#DBDDD4" stroke-width="1"/>
  <text x="464.0" y="288" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#5B6058" text-anchor="middle">50%</text>
  <line x1="582.0" y1="108" x2="582.0" y2="270" stroke="#DBDDD4" stroke-width="1"/>
  <text x="582.0" y="288" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#5B6058" text-anchor="middle">75%</text>
  <line x1="700.0" y1="108" x2="700.0" y2="270" stroke="#DBDDD4" stroke-width="1"/>
  <text x="700.0" y="288" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#5B6058" text-anchor="middle">100%</text>
  <text x="210" y="142" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13.5" fill="#171B1A" text-anchor="end">Healthy</text>
  <rect x="228" y="122" width="467.3" height="30" rx="3" fill="#3E7C74"/>
  <text x="716" y="142" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15" font-weight="500" fill="#171B1A">99.0%</text>
  <text x="210" y="198" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13.5" fill="#171B1A" text-anchor="end">Stroke</text>
  <rect x="228" y="178" width="453.1" height="30" rx="3" fill="#3E7C74"/>
  <text x="716" y="198" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15" font-weight="500" fill="#171B1A">96.0%</text>
  <text x="210" y="254" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13.5" fill="#171B1A" text-anchor="end">Combined</text>
  <rect x="228" y="234" width="455.0" height="30" rx="3" fill="#3E7C74"/>
  <text x="716" y="254" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15" font-weight="500" fill="#171B1A">96.4%</text>
  <line x1="228" y1="270" x2="700" y2="270" stroke="#5B6058" stroke-width="1"/>
  <text x="36" y="324" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" fill="#6B4507">The combined model held its accuracy across both populations.</text>
</svg>
