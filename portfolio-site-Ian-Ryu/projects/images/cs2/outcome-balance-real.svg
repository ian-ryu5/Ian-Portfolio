<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="t d">
  <title id="t">Recorded Match Outcomes</title>
  <desc id="d">Bar chart showing team one won 5,115 matches and team two won 3,111.</desc>
  <rect width="900" height="450" fill="#FBFCF9"/>
  <text x="36" y="46" font-family="Space Grotesk, Arial, sans-serif" font-size="24" font-weight="600" fill="#171B1A">Recorded Match Outcomes</text>
  <text x="36" y="72" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13.5" fill="#5B6058">8,226 cleaned matches, as labelled by the original analysis’s win flag</text>
  <line x1="300" y1="340.0" x2="722" y2="340.0" stroke="#DBDDD4" stroke-width="1"/>
  <text x="288" y="344.0" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11.5" fill="#5B6058" text-anchor="end">0</text>
  <line x1="300" y1="270.0" x2="722" y2="270.0" stroke="#DBDDD4" stroke-width="1"/>
  <text x="288" y="274.0" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11.5" fill="#5B6058" text-anchor="end">2,000</text>
  <line x1="300" y1="200.0" x2="722" y2="200.0" stroke="#DBDDD4" stroke-width="1"/>
  <text x="288" y="204.0" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11.5" fill="#5B6058" text-anchor="end">4,000</text>
  <line x1="300" y1="130.0" x2="722" y2="130.0" stroke="#DBDDD4" stroke-width="1"/>
  <text x="288" y="134.0" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11.5" fill="#5B6058" text-anchor="end">6,000</text>
  <rect x="315.0" y="161.0" width="130" height="179.0" rx="3" fill="#E2A33B"/>
  <text x="380" y="147.0" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="17" font-weight="500" fill="#171B1A" text-anchor="middle">5,115</text>
  <text x="380" y="366" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13.5" fill="#5B6058" text-anchor="middle">Team 1 win</text>
  <text x="380" y="386" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#5B6058" text-anchor="middle">62.2%</text>
  <rect x="535.0" y="231.1" width="130" height="108.9" rx="3" fill="#3E7C74"/>
  <text x="600" y="217.1" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="17" font-weight="500" fill="#171B1A" text-anchor="middle">3,111</text>
  <text x="600" y="366" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13.5" fill="#5B6058" text-anchor="middle">Team 2 win</text>
  <text x="600" y="386" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#5B6058" text-anchor="middle">37.8%</text>
  <line x1="300" y1="340" x2="722" y2="340" stroke="#5B6058" stroke-width="1"/>
  <text x="36" y="426" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" fill="#6B4507">This imbalance is what set the 66.2% majority-class baseline the model had to beat.</text>
</svg>
