<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
  <title id="title">Distributions of rolling team-difference features</title>
  <desc id="desc">Illustrative distributions centered near zero for rolling rating and swing percentage differences.</desc>
  <rect width="900" height="470" fill="#FBFCF9"/>
  <g font-family="IBM Plex Sans, Arial, sans-serif" fill="#171B1A"><text x="55" y="50" font-size="24" font-weight="600">Rolling Feature Distributions</text><text x="55" y="77" font-size="14" fill="#5B6058">Team 1 minus team 2, calculated over each team's previous five matches</text></g>
  <g stroke="#DBDDD4" stroke-width="1"><path d="M95 130v120M95 250h720M95 315v120M95 435h720"/><path d="M455 130v120M455 315v120"/></g>
  <g fill="#3E7C74" opacity=".78"><rect x="150" y="224" width="32" height="26"/><rect x="188" y="209" width="32" height="41"/><rect x="226" y="182" width="32" height="68"/><rect x="264" y="157" width="32" height="93"/><rect x="302" y="142" width="32" height="108"/><rect x="340" y="151" width="32" height="99"/><rect x="378" y="167" width="32" height="83"/><rect x="416" y="194" width="32" height="56"/><rect x="454" y="217" width="32" height="33"/><rect x="492" y="231" width="32" height="19"/><rect x="530" y="240" width="32" height="10"/><rect x="568" y="245" width="32" height="5"/><rect x="606" y="248" width="32" height="2"/></g>
  <g fill="#E2A33B" opacity=".78"><rect x="150" y="415" width="32" height="20"/><rect x="188" y="399" width="32" height="36"/><rect x="226" y="370" width="32" height="65"/><rect x="264" y="340" width="32" height="95"/><rect x="302" y="322" width="32" height="113"/><rect x="340" y="331" width="32" height="104"/><rect x="378" y="350" width="32" height="85"/><rect x="416" y="378" width="32" height="57"/><rect x="454" y="404" width="32" height="31"/><rect x="492" y="421" width="32" height="14"/><rect x="530" y="429" width="32" height="6"/><rect x="568" y="433" width="32" height="2"/></g>
  <g font-family="IBM Plex Mono, monospace" font-size="12" fill="#5B6058"><text x="55" y="170" fill="#171B1A">Rating difference</text><text x="55" y="355" fill="#171B1A">Swing% difference</text><text x="445" y="267">0</text><text x="445" y="452">0</text><text x="95" y="267">lower</text><text x="760" y="267">higher</text><text x="95" y="452">lower</text><text x="760" y="452">higher</text></g>
</svg>
