<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 406" role="img" aria-labelledby="t d">
  <title id="t">Sensor Ablation</title>
  <desc id="d">Bar chart comparing accuracy for stroke baseline 96.0 percent, stroke wrist-only 93.0 percent, combined baseline 96.4 percent, and combined without insole about 91.5 percent.</desc>
  <rect width="900" height="406" fill="#FBFCF9"/>
  <text x="36" y="46" font-family="Space Grotesk, Arial, sans-serif" font-size="24" font-weight="600" fill="#171B1A">Sensor Ablation</text>
  <text x="36" y="72" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13.5" fill="#5B6058">How removing sensor groups changed classification accuracy</text>

  <line x1="228.0" y1="108" x2="228.0" y2="326" stroke="#DBDDD4" stroke-width="1"/>
  <text x="228.0" y="344" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#5B6058" text-anchor="middle">0%</text>
  <line x1="346.0" y1="108" x2="346.0" y2="326" stroke="#DBDDD4" stroke-width="1"/>
  <text x="346.0" y="344" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#5B6058" text-anchor="middle">25%</text>
  <line x1="464.0" y1="108" x2="464.0" y2="326" stroke="#DBDDD4" stroke-width="1"/>
  <text x="464.0" y="344" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#5B6058" text-anchor="middle">50%</text>
  <line x1="582.0" y1="108" x2="582.0" y2="326" stroke="#DBDDD4" stroke-width="1"/>
  <text x="582.0" y="344" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#5B6058" text-anchor="middle">75%</text>
  <line x1="700.0" y1="108" x2="700.0" y2="326" stroke="#DBDDD4" stroke-width="1"/>
  <text x="700.0" y="344" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#5B6058" text-anchor="middle">100%</text>
  <text x="210" y="142" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13.5" fill="#171B1A" text-anchor="end">Stroke baseline</text>
  <rect x="228" y="122" width="453.1" height="30" rx="3" fill="#3E7C74"/>
  <text x="716" y="142" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15" font-weight="500" fill="#171B1A">96.0%</text>
  <text x="210" y="198" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13.5" fill="#171B1A" text-anchor="end">Stroke wrist-only</text>
  <rect x="228" y="178" width="439.0" height="30" rx="3" fill="#E2A33B"/>
  <text x="716" y="198" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15" font-weight="500" fill="#171B1A">93.0%</text>
  <text x="773" y="198" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12.5" fill="#5B6058">−3.0 pts</text>
  <text x="210" y="254" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13.5" fill="#171B1A" text-anchor="end">Combined baseline</text>
  <rect x="228" y="234" width="455.0" height="30" rx="3" fill="#3E7C74"/>
  <text x="716" y="254" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15" font-weight="500" fill="#171B1A">96.4%</text>
  <text x="210" y="310" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13.5" fill="#171B1A" text-anchor="end">Combined no insole</text>
  <rect x="228" y="290" width="431.9" height="30" rx="3" fill="#E2A33B"/>
  <text x="716" y="310" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15" font-weight="500" fill="#171B1A">≈91.5%</text>
  <text x="782" y="310" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12.5" fill="#5B6058">−4.9 pts</text>
  <line x1="228" y1="326" x2="700" y2="326" stroke="#5B6058" stroke-width="1"/>
  <text x="36" y="380" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" fill="#6B4507">Removing the insole produced the clearest drop; point differences are labelled because the bars sit close together.</text>
</svg>
